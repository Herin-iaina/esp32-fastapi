# Mosquitto Configuration for ESP32 Incubator

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Listeners
# MQTT standard port (for ESP32 and middleware)
listener 1883
protocol mqtt

# WebSocket port (for web clients)
listener 9001
protocol websockets

# Allow anonymous connections (for development)
# Pour la production, configurer l'authentification
allow_anonymous true

# Message size limit (1MB)
message_size_limit 1048576

# Connection settings
max_connections -1
