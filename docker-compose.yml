services:
  # Backend FastAPI (Production - Serve Frontend)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: esp32-backend
    ports:
      - "8000:8000"
    environment:
      - APP_DATABASE_URL=${APP_DATABASE_URL}
      - APP_ENVIRONMENT=${APP_ENVIRONMENT}
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps:/app/apps
      - ./routers:/app/routers
      - ./models:/app/models
      - ./core:/app/core
      - ./logs:/app/logs
      - ./frontend/dist:/app/frontend/dist:ro
    networks:
      - ${APP_NETWORK_NAME}
    command: uvicorn run:app --host 0.0.0.0 --port 8000 --reload

  # Frontend static (Production) - sert le build via nginx
  frontend:
    image: nginx:alpine
    container_name: esp32-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ${APP_NETWORK_NAME}

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: esp32-db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ${APP_NETWORK_NAME}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:


networks:
  ${APP_NETWORK_NAME}:
    driver: bridge
