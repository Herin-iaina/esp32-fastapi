services:
  # Backend FastAPI (Production - Serve Frontend)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: esp32-backend
    ports:
      - "8000:8000"
    environment:
      - APP_DATABASE_URL=postgresql://user:password@db:5432/smartelia_db
      - APP_ENVIRONMENT=prod
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps:/app/apps
      - ./routers:/app/routers
      - ./models:/app/models
      - ./core:/app/core
      - ./logs:/app/logs
      - ./frontend/dist:/app/frontend/dist:ro
    networks:
      - smartelia-network
    command: uvicorn run:app --host 0.0.0.0 --port 8000 --reload
  
  # Frontend static (Production) - sert le build via nginx
  frontend:
    image: nginx:alpine
    container_name: esp32-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - smartelia-network

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: esp32-db
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=smartelia_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smartelia-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  smartelia-network:
    driver: bridge
