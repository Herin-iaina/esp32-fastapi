services:
  # Backend FastAPI (Production - Serve Frontend)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: esp32-backend
    ports:
      - "8000:8000"
    environment:
      - APP_DATABASE_URL=${APP_DATABASE_URL}
      - APP_ENVIRONMENT=${APP_ENVIRONMENT}
      - APP_SECRET_KEY=${APP_SECRET_KEY}
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps:/app/apps
      - ./routers:/app/routers
      - ./models:/app/models
      - ./core:/app/core
      - ./logs:/app/logs
      - ./frontend/dist:/app/frontend/dist:ro
    networks:
      - incubator_network
    command: uvicorn run:app --host 0.0.0.0 --port 8000 --reload

  # Frontend static (Production) - construit l’image avec le build frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: esp32-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - incubator_network

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: esp32-db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-smartelia_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - incubator_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-smartelia_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:


networks:
  incubator_network:
    name: ${APP_NETWORK_NAME}
    driver: bridge
