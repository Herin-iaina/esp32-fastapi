<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Smartelia Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>
    
    <nav class="sidebar">
        <h2>Smartelia</h2>
        <a href="/" class="nav-link {% if active_page == 'dashboard' %}active{% endif %}">
            <i class="bi bi-speedometer2"></i> Dashboard
        </a>
        <a href="/settings" class="nav-link {% if active_page == 'settings' %}active{% endif %}">
            <i class="bi bi-gear"></i> Settings
        </a>
        <a href="#" class="nav-link">
            <i class="bi bi-box-arrow-right"></i> Logout
        </a>
    </nav>

    <div class="main-content">
        <header>
            <h3>{% block header_title %}Overview{% endblock %}</h3>
            <div class="user-info">
                <span>Admin User</span>
            </div>
        </header>

        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
